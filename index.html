function drawCards(count) {
    const display = document.getElementById('cardDisplay');
    display.innerHTML = '';
    
    // สุ่มไพ่แบบไม่ซ้ำกันจาก 40 ใบ
    const shuffled = [...cards].sort(() => 0.5 - Math.random());
    const selected = shuffled.slice(0, count);
    
    const titles = ["1. สถานการณ์ปัจจุบัน", "2. ทางออก / คำแนะนำ", "3. ผลลัพธ์ / พลังงานบวก"];
    
    selected.forEach((card, index) => {
        const cardElement = document.createElement('div');
        cardElement.className = 'card-box';
        
        let positionTitle = count === 3 ? `<div style="color: #a6f0ff; font-weight: bold; font-size: 13px; margin-bottom: 5px;">📌 ตำแหน่งที่ ${titles[index]}</div>` : '';
        
        cardElement.innerHTML = `
            ${positionTitle}
            <div class="card-title">✨ ${card.name}</div>
            <div class="card-keyword">🔑 ${card.keyword}</div>
            <div class="card-meaning">${card.meaning}</div>
            <div class="card-quote">${card.quote}</div>
        `;
        display.appendChild(cardElement);
    });
}
</script>
