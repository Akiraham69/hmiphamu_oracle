<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไพ่ญาณ ณ โลก - บอสพี่อ๋อง</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            --card-glass: rgba(30, 41, 59, 0.65);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold-primary: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.35);
            --btn-gradient: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            --btn-hover: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --reset-gradient: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
        }

        body {
            font-family: 'Kanit', sans-serif, system-ui;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--gold-primary);
            font-size: 2.2rem;
            font-weight: 600;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px var(--gold-glow);
            letter-spacing: 1.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
        }

        .controls {
            margin-bottom: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: var(--btn-gradient);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
        }

        button:hover {
            background: var(--btn-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.4);
        }

        .btn-reset {
            background: var(--reset-gradient);
            display: none; 
        }

        .btn-reset:hover {
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
            perspective: 1000px;
        }

        .card-item {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px;
            width: 210px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardAppear 0.5s ease backwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) rotateX(10deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        .card-item:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--gold-primary);
            box-shadow: 0 20px 45px var(--gold-glow);
        }

        .card-image-wrapper {
            width: 100%;
            height: 300px;
            background-color: #0b0f19;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
        }

        .card-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.4s ease;
        }

        .card-item:hover img {
            transform: scale(1.05);
        }

        .fallback-content {
            padding: 15px;
            text-align: center;
            color: var(--text-muted);
        }

        .card-name {
            margin-top: 16px;
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        /* Modal ขยายภาพพรีเมียม */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 7, 11, 0.92);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal img {
            max-width: 85vw;
            max-height: 75vh;
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            border: 2px solid var(--gold-primary);
        }

        .modal h2 {
            margin-top: 25px;
            color: var(--gold-primary);
            font-size: 1.8rem;
            font-weight: 500;
            text-shadow: 0 0 15px var(--gold-glow);
            letter-spacing: 1px;
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 3rem;
            color: #fff;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--gold-primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>🔮 ไพ่ญาณ ณ โลก 🔮</h1>
        <p class="subtitle">ระบบสุ่มเปิดหน้าไพ่พยากรณ์</p>
    </header>

    <div class="controls">
        <button onclick="drawCards(1)">🎴 เปิดไพ่ 1 ใบ</button>
        <button onclick="drawCards(3)">🎴 เปิดไพ่ 3 ใบ</button>
        <button id="resetBtn" class="btn-reset" onclick="resetReading()">🔄 เริ่มใหม่</button>
    </div>

    <div class="card-container" id="cardContainer">
        <!-- ไพ่จะแสดงที่นี่ -->
    </div>

    <!-- Modal ขยายภาพ -->
    <div class="modal" id="cardModal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img id="modalImg" src="" alt="Expanded Card">
        <h2 id="modalTitle"></h2>
    </div>

    <script>
        let allCards = [];

        // โหลดข้อมูลจาก cards.json อัตโนมัติ
        fetch('cards.json')
            .then(response => response.json())
            .then(data => {
                allCards = data;
            })
            .catch(error => console.error('Error loading cards.json:', error));

        function drawCards(count) {
            if (allCards.length === 0) {
                alert('กำลังโหลดข้อมูลไพ่ กรุณาสักครู่...');
                return;
            }

            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            let shuffled = [...allCards].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, count);

            selected.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-item';
                cardDiv.style.animationDelay = `${index * 0.15}s`;
                cardDiv.onclick = () => openModal(card.image, card.name);

                cardDiv.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${card.image}" alt="${card.name}" onerror="handleImageError(this)">
                        <div class="fallback-content" style="display:none; position:absolute; width:100%; height:100%; flex-direction:column; justify-content:center; align-items:center;">
                            <span style="font-size: 2.8rem; margin-bottom: 8px;">🎴</span>
                            <small style="color: #cbd5e1; font-weight: 500; font-size: 0.9rem;">ใบที่ ${card.id}</small>
                            <small style="color: #ef4444; font-size: 0.75rem; margin-top: 4px;">ไม่พบไฟล์รูปในระบบ</small>
                        </div>
                    </div>
                    <div class="card-name">${card.name}</div>
                `;
                container.appendChild(cardDiv);
            });

            // แสดงปุ่ม "เริ่มใหม่" หลังจากเปิดไพ่แล้ว
            document.getElementById('resetBtn').style.display = 'inline-block';
        }

        function handleImageError(imgElement) {
            imgElement.style.display = 'none';
            imgElement.nextElementSibling.style.display = 'flex';
        }

        function resetReading() {
            document.getElementById('cardContainer').innerHTML = '';
            document.getElementById('resetBtn').style.display = 'none';
        }

        function openModal(imgSrc, title) {
            const modal = document.getElementById('cardModal');
            const modalImg = document.getElementById('modalImg');
            const modalTitle = document.getElementById('modalTitle');

            modalImg.src = imgSrc;
            modalImg.onerror = function() {
                this.style.display = 'none';
            };
            modalImg.onload = function() {
                this.style.display = 'block';
            };

            modalTitle.textContent = title;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalImg').src = '';
            document.getElementById('cardModal').style.display = 'none';
        }
    </script>
</body>
</html>
