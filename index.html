<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไพ่ญาณ ณ โลก - บอสพี่อ๋อง</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }
        body {
            font-family: 'Kanit', sans-serif, system-ui;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 10px;
            color: var(--accent-color);
            text-align: center;
        }
        .controls {
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-reset {
            background-color: #ef4444;
            color: #fff;
            display: none; /* ซ่อนไว้ก่อน จะแสดงเมื่อเปิดไพ่แล้วเท่านั้น */
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1000px;
        }
        .card-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            width: 180px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-item:hover {
            transform: translateY(-5px);
        }
        .card-image-wrapper {
            width: 100%;
            height: 260px;
            background-color: #334155;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .card-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        .fallback-content {
            padding: 10px;
            text-align: center;
            color: #94a3b8;
        }
        .card-name {
            margin-top: 12px;
            font-size: 1.05rem;
            font-weight: 500;
        }
        /* Modal สำหรับขยายภาพไพ่ */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        .modal img {
            max-width: 90vw;
            max-height: 75vh;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal h2 {
            margin-top: 20px;
            color: #fff;
            font-size: 1.5rem;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🔮 ไพ่ญาณ ณ โลก 🔮</h1>
    <div class="controls">
        <button onclick="drawCards(1)">🎴 เปิดไพ่ 1 ใบ</button>
        <button onclick="drawCards(3)">🎴 เปิดไพ่ 3 ใบ</button>
        <button id="resetBtn" class="btn-reset" onclick="resetReading()">🔄 เริ่มใหม่</button>
    </div>

    <div class="card-container" id="cardContainer">
        <!-- ไพ่จะแสดงที่นี่ -->
    </div>

    <!-- Modal ขยายภาพ -->
    <div class="modal" id="cardModal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img id="modalImg" src="" alt="Expanded Card">
        <h2 id="modalTitle"></h2>
    </div>

    <script>
        let allCards = [];

        // โหลดข้อมูลจาก cards.json อัตโนมัติ
        fetch('cards.json')
            .then(response => response.json())
            .then(data => {
                allCards = data;
            })
            .catch(error => console.error('Error loading cards.json:', error));

        function drawCards(count) {
            if (allCards.length === 0) {
                alert('กำลังโหลดข้อมูลไพ่ กรุณาสักครู่...');
                return;
            }

            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            // สุ่มไพ่แบบไม่ซ้ำกัน
            let shuffled = [...allCards].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, count);

            selected.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-item';
                // คลิกที่การ์ดเพื่อขยายภาพใหญ่
                cardDiv.onclick = () => openModal(card.image_file, card.name);

                cardDiv.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${card.image_file}" alt="${card.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="fallback-content" style="display:none; position:absolute; width:100%; height:100%; flex-direction:column; justify-content:center; align-items:center;">
                            <span style="font-size: 2rem;">🎴</span>
                            <small style="color: #cbd5e1; padding: 0 10px;">ใบที่ ${card.id}</small>
                        </div>
                    </div>
                    <div class="card-name">${card.name}</div>
                `;
                container.appendChild(cardDiv);
            });

            // แสดงปุ่ม "เริ่มใหม่" หลังจากเปิดไพ่แล้ว
            document.getElementById('resetBtn').style.display = 'inline-block';
        }

        function resetReading() {
            document.getElementById('cardContainer').innerHTML = '';
            // ซ่อนปุ่ม "เริ่มใหม่" เมื่อเคลียร์หน้าจอ
            document.getElementById('resetBtn').style.display = 'none';
        }

        function openModal(imgSrc, title) {
            const modal = document.getElementById('cardModal');
            const modalImg = document.getElementById('modalImg');
            const modalTitle = document.getElementById('modalTitle');

            modalImg.src = imgSrc;
            modalImg.onerror = function() {
                this.style.display = 'none';
            };
            modalImg.onload = function() {
                this.style.display = 'block';
            };

            modalTitle.textContent = title;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalImg').src = '';
            document.getElementById('cardModal').style.display = 'none';
        }
    </script>
</body>
</html>
