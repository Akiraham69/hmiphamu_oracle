<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไพ่ญาณ ณ โลก - บอสพี่อ๋อง</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1a1c29 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f1f5f9;
            --accent-gold: #fbbf24;
            --accent-glow: rgba(251, 191, 36, 0.3);
            --primary-btn: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            --reset-btn: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        }
        body {
            font-family: 'Kanit', sans-serif, system-ui;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 25px;
            color: var(--accent-gold);
            text-align: center;
            font-weight: 600;
            text-shadow: 0 0 15px var(--accent-glow);
            letter-spacing: 1px;
        }
        .controls {
            margin-bottom: 35px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: var(--primary-btn);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
        }
        .btn-reset {
            background: var(--reset-btn);
            display: none; 
        }
        .btn-reset:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1100px;
        }
        .card-item {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            width: 200px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .card-item:hover {
            transform: translateY(-8px);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 35px var(--accent-glow);
        }
        .card-image-wrapper {
            width: 100%;
            height: 280px;
            background-color: #0f172a;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .card-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        .card-item:hover img {
            transform: scale(1.03);
        }
        .fallback-content {
            padding: 15px;
            text-align: center;
            color: #94a3b8;
        }
        .card-name {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #f8fafc;
        }
        /* Modal สำหรับขยายภาพไพ่แบบพรีเมียม */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 7, 11, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal img {
            max-width: 85vw;
            max-height: 70vh;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 2px solid var(--accent-gold);
        }
        .modal h2 {
            margin-top: 25px;
            color: var(--accent-gold);
            font-size: 1.6rem;
            font-weight: 500;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .modal-close {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <h1>🔮 ไพ่ญาณ ณ โลก 🔮</h1>
    <div class="controls">
        <button onclick="drawCards(1)">🎴 เปิดไพ่ 1 ใบ</button>
        <button onclick="drawCards(3)">🎴 เปิดไพ่ 3 ใบ</button>
        <button id="resetBtn" class="btn-reset" onclick="resetReading()">🔄 เริ่มใหม่</button>
    </div>

    <div class="card-container" id="cardContainer">
        <!-- ไพ่จะแสดงที่นี่ -->
    </div>

    <!-- Modal ขยายภาพ -->
    <div class="modal" id="cardModal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img id="modalImg" src="" alt="Expanded Card">
        <h2 id="modalTitle"></h2>
    </div>

    <script>
        let allCards = [];

        // โหลดข้อมูลจาก cards.json อัตโนมัติ
        fetch('cards.json')
            .then(response => response.json())
            .then(data => {
                allCards = data;
            })
            .catch(error => console.error('Error loading cards.json:', error));

        function drawCards(count) {
            if (allCards.length === 0) {
                alert('กำลังโหลดข้อมูลไพ่ กรุณาสักครู่...');
                return;
            }

            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            let shuffled = [...allCards].sort(() => 0.5 - Math.random());
            let selected = shuffled.slice(0, count);

            selected.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-item';
                cardDiv.onclick = () => openModal(card.image_file, card.name);

                cardDiv.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${card.image_file}" alt="${card.name}" onerror="handleImageError(this, ${card.id})">
                        <div class="fallback-content" style="display:none; position:absolute; width:100%; height:100%; flex-direction:column; justify-content:center; align-items:center;">
                            <span style="font-size: 2.5rem; margin-bottom: 8px;">🎴</span>
                            <small style="color: #cbd5e1; font-weight: 500;">ใบที่ ${card.id}</small>
                            <small style="color: #94a3b8; font-size: 0.8rem; margin-top: 4px;">(ไม่พบไฟล์รูป)</small>
                        </div>
                    </div>
                    <div class="card-name">${card.name}</div>
                `;
                container.appendChild(cardDiv);
            });

            document.getElementById('resetBtn').style.display = 'inline-block';
        }

        // ฟังก์ชันช่วยจัดการกรณีรูปโหลดไม่ขึ้น (เช็ค path เผื่อสลับ / หรือ \)
        function handleImageError(imgElement, cardId) {
            imgElement.style.display = 'none';
            imgElement.nextElementSibling.style.display = 'flex';
        }

        function resetReading() {
            document.getElementById('cardContainer').innerHTML = '';
            document.getElementById('resetBtn').style.display = 'none';
        }

        function openModal(imgSrc, title) {
            const modal = document.getElementById('cardModal');
            const modalImg = document.getElementById('modalImg');
            const modalTitle = document.getElementById('modalTitle');

            modalImg.src = imgSrc;
            modalImg.onerror = function() {
                this.style.display = 'none';
            };
            modalImg.onload = function() {
                this.style.display = 'block';
            };

            modalTitle.textContent = title;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalImg').src = '';
            document.getElementById('cardModal').style.display = 'none';
        }
    </script>
</body>
</html>
